<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="Terminal: sobre mí y en qué estoy ahora"><title>Terminal: sobre mí y en qué estoy ahora</title><style>@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2');font-weight:400}@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2');font-weight:500}.f{opacity:0;animation:f .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:p .5s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes p{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}.t{animation-name:t;animation-fill-mode:forwards}@keyframes t{99%{opacity:1}to{transform:translateX(var(--w));opacity:0}}.b{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}.o{transform-box:fill-box;transform-origin:center;animation:o 2.2s ease-out infinite}@keyframes o{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}.l{stroke-dasharray:var(--d);stroke-dashoffset:var(--d);animation:l 1.4s cubic-bezier(.6,0,.2,1) forwards}@keyframes l{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.f,.p{animation:none;opacity:1}.t{display:none}.b,.o{animation:none}.l{animation:none;stroke-dashoffset:0}}</style><rect x="0.5" y="0.5" width="1199" height="375" rx="18" fill="#0E1013" stroke="#262A31"/><rect x="1" y="1" width="1198" height="46" rx="17" fill="#14171C"/><rect x="1" y="30" width="1198" height="17" fill="#14171C"/><line x1="1" y1="47" x2="1199" y2="47" stroke="#262A31"/><circle cx="28" cy="24" r="6" fill="#262A31"/><circle cx="48" cy="24" r="6" fill="#262A31"/><circle cx="68" cy="24" r="6" fill="#262A31"/><text x="600.0" y="29.0" font-family="M" font-weight="400" font-size="13" fill="#9A9DA4" text-anchor="middle">jordan@aragon — zsh</text><text x="48.0" y="92.0" font-family="M" font-weight="500" font-size="15" fill="#3FB950" class="f" style="animation-delay:0.30s">❯</text><text x="70.0" y="92.0" font-family="M" font-weight="500" font-size="15" fill="#EDEDEA">cat sobre-mi.txt</text><rect class="t" x="69.0" y="77.0" width="160.0" height="21.8" fill="#0E1013" style="--w:160.0px;animation-duration:0.80s;animation-timing-function:steps(16);animation-delay:0.35s"/><text x="70.0" y="120.0" font-family="M" font-weight="400" font-size="15" fill="#9A9DA4" class="f" style="animation-delay:1.40s">Empecé arreglando computadores y redes. Esa curiosidad por entender cómo funcionan las cosas me llevó a construirlas:</text><text x="70.0" y="148.0" font-family="M" font-weight="400" font-size="15" fill="#9A9DA4" class="f" style="animation-delay:1.48s">hoy hago webs, agentes de IA y automatizaciones para clientes reales.</text><text x="48.0" y="188.0" font-family="M" font-weight="500" font-size="15" fill="#3FB950" class="f" style="animation-delay:1.56s">❯</text><text x="70.0" y="188.0" font-family="M" font-weight="500" font-size="15" fill="#EDEDEA">cat ahora.txt</text><rect class="t" x="69.0" y="173.0" width="133.0" height="21.8" fill="#0E1013" style="--w:133.0px;animation-duration:0.65s;animation-timing-function:steps(13);animation-delay:1.61s"/><text x="70.0" y="216.0" font-family="M" font-weight="400" font-size="15" fill="#5C6069" class="f" style="animation-delay:2.51s">→</text><text x="94.0" y="216.0" font-family="M" font-weight="400" font-size="15" fill="#9A9DA4" class="f" style="animation-delay:2.51s">Líder técnico en Ocean Industries: webs, agentes de IA y automatización</text><text x="70.0" y="244.0" font-family="M" font-weight="400" font-size="15" fill="#5C6069" class="f" style="animation-delay:2.63s">→</text><text x="94.0" y="244.0" font-family="M" font-weight="400" font-size="15" fill="#9A9DA4" class="f" style="animation-delay:2.63s">Construyendo AiDEN: gestión de viveros con backend y agente de IA</text><text x="70.0" y="272.0" font-family="M" font-weight="400" font-size="15" fill="#5C6069" class="f" style="animation-delay:2.75s">→</text><text x="94.0" y="272.0" font-family="M" font-weight="400" font-size="15" fill="#9A9DA4" class="f" style="animation-delay:2.75s">Operando Aragon Server: diez servicios en mi propio servidor</text><text x="70.0" y="300.0" font-family="M" font-weight="400" font-size="15" fill="#5C6069" class="f" style="animation-delay:2.87s">→</text><text x="94.0" y="300.0" font-family="M" font-weight="400" font-size="15" fill="#9A9DA4" class="f" style="animation-delay:2.87s">Estudiando Ingeniería de Sistemas (UNAD) y ADSO (SENA)</text><text x="48.0" y="340.0" font-family="M" font-weight="500" font-size="15" fill="#3FB950" class="f" style="animation-delay:2.99s">❯</text><text x="70.0" y="340.0" font-family="M" font-weight="500" font-size="15" fill="#EDEDEA">open jordanco.club</text><rect class="t" x="69.0" y="325.0" width="178.0" height="21.8" fill="#0E1013" style="--w:178.0px;animation-duration:0.90s;animation-timing-function:steps(18);animation-delay:3.04s"/><rect class="f" x="238.0" y="327" width="9" height="17" fill="#EDEDEA" style="animation-delay:3.94s"><animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="4.24s" repeatCount="indefinite" calcMode="discrete"/></rect></svg>