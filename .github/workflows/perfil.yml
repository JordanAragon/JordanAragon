name: Perfil

on:
  schedule:
    - cron: "17 11 * * *" # todos los días, 6:17 a. m. en Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/perfil.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar las imágenes si cambiaron
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "perfil: imágenes actualizadas"
            git push
          fi
